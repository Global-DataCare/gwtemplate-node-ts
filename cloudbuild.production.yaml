steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=gwtemplate-node-ts/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: europe-west4-docker.pkg.dev/uhc-unid-production/uhc-unid/gdc-unid-node-ts:production
