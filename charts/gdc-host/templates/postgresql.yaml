{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gdc-host.postgresqlService" . }}
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "gdc-host.postgresqlService" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "gdc-host.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.postgresql.existingSecret }}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgresql.existingSecret }}, key: POSTGRES_PASSWORD } }
          ports: [{ name: postgresql, containerPort: 5432 }]
          volumeMounts: [{ name: postgresql-data, mountPath: /var/lib/postgresql/data }]
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: postgresql-data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gdc-host.postgresqlService" . }}
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
  ports: [{ name: postgresql, port: 5432, targetPort: postgresql }]
{{- end }}
