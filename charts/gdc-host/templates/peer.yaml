{{- if .Values.peer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gdc-host.fullname" . }}-ccaas-builder
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: peer
data:
  detect: |-
    #!/bin/sh
    grep -Eq '"type"[[:space:]]*:[[:space:]]*"ccaas"' "$2/metadata.json"
  build: |-
    #!/bin/sh
    set -eu
    test -f "$1/connection.json"
    cp "$1/connection.json" "$3/connection.json"
  release: |-
    #!/bin/sh
    set -eu
    mkdir -p "$2/chaincode/server"
    cp "$1/connection.json" "$2/chaincode/server/connection.json"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gdc-host.peerService" . }}
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: peer
spec:
  serviceName: {{ include "gdc-host.peerService" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: peer
  template:
    metadata:
      labels:
        {{- include "gdc-host.labels" . | nindent 8 }}
        app.kubernetes.io/component: peer
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-msp
          image: {{ .Values.images.init | quote }}
          command: [sh, -c]
          args:
            - |
              set -eu
              {{- if .Values.authorization.existingSecret }}
              test -s /var/run/gdc-host-authorization/{{ .Values.authorization.key }}
              {{- end }}
              tar -xzf /msp-source/msp.tgz -C /msp
              tar -xzf /tls-source/tls.tgz -C /tls
              cp /tls/signcerts/cert.pem /tls/server.crt
              cp /tls/keystore/*_sk /tls/server.key
              cp /tls/tlscacerts/*.pem /tls/ca.crt
              if ls /tls/tlsintermediatecerts/*.pem >/dev/null 2>&1; then
                cat /tls/tlsintermediatecerts/*.pem >> /tls/ca.crt
              fi
          volumeMounts:
            - { name: msp-source, mountPath: /msp-source, readOnly: true }
            - { name: tls-source, mountPath: /tls-source, readOnly: true }
            - { name: msp, mountPath: /msp }
            - { name: tls, mountPath: /tls }
            {{- if .Values.authorization.existingSecret }}
            - { name: host-authorization, mountPath: /var/run/gdc-host-authorization, readOnly: true }
            {{- end }}
      containers:
        - name: peer
          image: {{ .Values.peer.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CORE_PEER_ID, value: {{ .Values.peer.name | quote }} }
            - { name: CORE_PEER_LOCALMSPID, value: {{ .Values.peer.mspId | quote }} }
            - { name: CORE_PEER_ADDRESS, value: {{ printf "%s:7051" (include "gdc-host.peerService" .) | quote }} }
            - { name: CORE_PEER_LISTENADDRESS, value: "0.0.0.0:7051" }
            - { name: CORE_PEER_CHAINCODEADDRESS, value: {{ printf "%s:7052" (include "gdc-host.peerService" .) | quote }} }
            - { name: CORE_PEER_CHAINCODELISTENADDRESS, value: "0.0.0.0:7052" }
            - { name: CORE_PEER_GOSSIP_EXTERNALENDPOINT, value: {{ .Values.peer.externalEndpoint | quote }} }
            - { name: CORE_PEER_GOSSIP_BOOTSTRAP, value: {{ default (printf "%s:7051" (include "gdc-host.peerService" .)) .Values.peer.bootstrap | quote }} }
            - { name: CORE_PEER_TLS_ENABLED, value: "true" }
            - { name: CORE_PEER_TLS_CERT_FILE, value: /etc/hyperledger/fabric/tls/server.crt }
            - { name: CORE_PEER_TLS_KEY_FILE, value: /etc/hyperledger/fabric/tls/server.key }
            - { name: CORE_PEER_TLS_ROOTCERT_FILE, value: /etc/hyperledger/fabric/tls/ca.crt }
            - { name: CORE_PEER_MSPCONFIGPATH, value: /etc/hyperledger/fabric/msp }
            - { name: CORE_LEDGER_STATE_STATEDATABASE, value: CouchDB }
            - { name: CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS, value: {{ printf "%s:5984" (include "gdc-host.couchdbService" .) | quote }} }
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.peer.couchdbSecretName }}, key: username } }
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.peer.couchdbSecretName }}, key: password } }
            - name: CORE_CHAINCODE_EXTERNALBUILDERS
              value: '[{"name":"ccaas_builder","path":"/opt/hyperledger/ccaas_builder","propagateEnvironment":[]}]'
          ports:
            - { name: peer, containerPort: 7051 }
            - { name: chaincode, containerPort: 7052 }
            - { name: operations, containerPort: 9443 }
          startupProbe:
            tcpSocket: { port: peer }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket: { port: peer }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: peer }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - { name: peer-data, mountPath: /var/hyperledger/production }
            - { name: msp, mountPath: /etc/hyperledger/fabric/msp }
            - { name: tls, mountPath: /etc/hyperledger/fabric/tls }
            - { name: ccaas-builder, mountPath: /opt/hyperledger/ccaas_builder/bin, readOnly: true }
          resources:
            {{- toYaml .Values.peer.resources | nindent 12 }}
      volumes:
        - name: msp-source
          secret: { secretName: {{ .Values.peer.mspSecretName }} }
        - name: tls-source
          secret: { secretName: {{ .Values.peer.tlsSecretName }} }
        {{- if .Values.authorization.existingSecret }}
        - name: host-authorization
          secret:
            secretName: {{ .Values.authorization.existingSecret }}
            items:
              - key: {{ .Values.authorization.key }}
                path: {{ .Values.authorization.key }}
        {{- end }}
        - { name: msp, emptyDir: {} }
        - { name: tls, emptyDir: {} }
        - name: ccaas-builder
          configMap: { name: {{ include "gdc-host.fullname" . }}-ccaas-builder, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: peer-data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.peer.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.peer.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gdc-host.peerService" . }}
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: peer
  {{- with .Values.peer.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.peer.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: peer
  ports:
    - { name: peer, port: {{ .Values.peer.service.port }}, targetPort: peer }
    - { name: chaincode, port: 7052, targetPort: chaincode }
{{- end }}
