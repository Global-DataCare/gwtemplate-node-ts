{{- if .Values.gw.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gdc-host.fullname" . }}-gw
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: gw
spec:
  replicas: {{ .Values.gw.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gw
  template:
    metadata:
      labels:
        {{- include "gdc-host.labels" . | nindent 8 }}
        app.kubernetes.io/component: gw
    spec:
      serviceAccountName: {{ include "gdc-host.gwServiceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gw
          image: {{ ternary .Values.gw.localImage .Values.gw.image (and (eq .Values.environment "local") (not (empty .Values.gw.localImage))) | quote }}
          imagePullPolicy: {{ .Values.gw.imagePullPolicy }}
          envFrom:
            - configMapRef: { name: {{ include "gdc-host.fullname" . }}-gw }
            - secretRef: { name: {{ .Values.gw.existingSecret }} }
          env:
            # Explicit values override stale compatibility keys that may still
            # exist in a migrated Secret. The selected peer is deployment
            # configuration, never secret material.
            - name: HLF_CONNECTION_PEER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gdc-host.fullname" . }}-gw
                  key: HLF_CONNECTION_PEER
            - name: {{ printf "HLF_CONNECTION_PEER_%s" .Values.peer.mspId }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gdc-host.fullname" . }}-gw
                  key: {{ printf "HLF_CONNECTION_PEER_%s" .Values.peer.mspId }}
            {{- if eq .Values.gw.awsCredentials.mode "roles-anywhere" }}
            - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
              value: {{ printf "http://127.0.0.1:%v" .Values.gw.awsCredentials.rolesAnywhere.port | quote }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "false"
            - name: AWS_EC2_METADATA_V1_DISABLED
              value: "true"
            {{- end }}
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /host/ping, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /host/ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gw.resources | nindent 12 }}
        {{- if eq .Values.gw.awsCredentials.mode "roles-anywhere" }}
        - name: aws-roles-anywhere
          image: {{ .Values.gw.awsCredentials.rolesAnywhere.image | quote }}
          imagePullPolicy: {{ .Values.gw.awsCredentials.rolesAnywhere.imagePullPolicy }}
          args:
            - serve
            - --certificate
            - {{ printf "/var/run/secrets/aws-roles-anywhere/%s" .Values.gw.awsCredentials.rolesAnywhere.certificateKey | quote }}
            - --private-key
            - {{ printf "/var/run/secrets/aws-roles-anywhere/%s" .Values.gw.awsCredentials.rolesAnywhere.privateKeyKey | quote }}
            {{- if .Values.gw.awsCredentials.rolesAnywhere.intermediatesKey }}
            - --intermediates
            - {{ printf "/var/run/secrets/aws-roles-anywhere/%s" .Values.gw.awsCredentials.rolesAnywhere.intermediatesKey | quote }}
            {{- end }}
            - --trust-anchor-arn
            - {{ .Values.gw.awsCredentials.rolesAnywhere.trustAnchorArn | quote }}
            - --profile-arn
            - {{ .Values.gw.awsCredentials.rolesAnywhere.profileArn | quote }}
            - --role-arn
            - {{ .Values.gw.awsCredentials.rolesAnywhere.roleArn | quote }}
            - --region
            - {{ .Values.gw.awsCredentials.rolesAnywhere.region | quote }}
            - --session-duration
            - {{ .Values.gw.awsCredentials.rolesAnywhere.sessionDurationSeconds | quote }}
            - --port
            - {{ .Values.gw.awsCredentials.rolesAnywhere.port | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          readinessProbe:
            tcpSocket: { port: {{ .Values.gw.awsCredentials.rolesAnywhere.port }} }
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gw.awsCredentials.rolesAnywhere.resources | nindent 12 }}
          volumeMounts:
            - name: aws-roles-anywhere-x509
              mountPath: /var/run/secrets/aws-roles-anywhere
              readOnly: true
        {{- end }}
      {{- if eq .Values.gw.awsCredentials.mode "roles-anywhere" }}
      volumes:
        - name: aws-roles-anywhere-x509
          secret:
            secretName: {{ .Values.gw.awsCredentials.rolesAnywhere.existingSecret }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gdc-host.fullname" . }}-gw
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: gw
spec:
  type: {{ .Values.gw.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gw
  ports:
    - { name: http, port: {{ .Values.gw.service.port }}, targetPort: http }
{{- if .Values.gw.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gdc-host.fullname" . }}-gw
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: gw
  {{- with .Values.gw.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gw.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.gw.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.host.domain | quote }}]
      secretName: {{ .Values.gw.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gdc-host.fullname" . }}-gw
                port: { name: http }
{{- end }}
{{- end }}
