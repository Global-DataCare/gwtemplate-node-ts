{{- if .Values.gw.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gdc-host.fullname" . }}-gw
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: gw
spec:
  replicas: {{ .Values.gw.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gw
  template:
    metadata:
      labels:
        {{- include "gdc-host.labels" . | nindent 8 }}
        app.kubernetes.io/component: gw
    spec:
      serviceAccountName: {{ include "gdc-host.gwServiceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gw
          image: {{ ternary .Values.gw.localImage .Values.gw.image (and (eq .Values.environment "local") (not (empty .Values.gw.localImage))) | quote }}
          imagePullPolicy: {{ .Values.gw.imagePullPolicy }}
          envFrom:
            - configMapRef: { name: {{ include "gdc-host.fullname" . }}-gw }
            - secretRef: { name: {{ .Values.gw.existingSecret }} }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /host/ping, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /host/ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gw.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gdc-host.fullname" . }}-gw
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: gw
spec:
  type: {{ .Values.gw.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gw
  ports:
    - { name: http, port: {{ .Values.gw.service.port }}, targetPort: http }
{{- if .Values.gw.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gdc-host.fullname" . }}-gw
  labels:
    {{- include "gdc-host.labels" . | nindent 4 }}
    app.kubernetes.io/component: gw
  {{- with .Values.gw.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gw.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.gw.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.host.domain | quote }}]
      secretName: {{ .Values.gw.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gdc-host.fullname" . }}-gw
                port: { name: http }
{{- end }}
{{- end }}
